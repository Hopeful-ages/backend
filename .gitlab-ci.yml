stages:
  - deploy

deploy_backend:
  stage: deploy
  only:
    - main
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client git
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -p ${VPS_PORT:-22} $VPS_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh -p ${VPS_PORT:-22} $VPS_USER@$VPS_HOST << 'ENDSSH'
        set -e
        echo "🚀 Deploying Backend..."
        cd /opt/app/backend
        git pull origin main
        docker compose down
        docker compose build --no-cache
        docker compose up -d
        sleep 10
        if docker ps | grep -q hopeful-backend; then
          echo "✅ Backend deployed!"
        else
          echo "❌ Failed!"
          exit 1
        fi
        docker image prune -af
      ENDSSH